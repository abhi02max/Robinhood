services:
  postgres:
    image: postgres:16
    container_name: robinhood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robinhood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robinhood}
      POSTGRES_DB: ${POSTGRES_DB:-robinhood}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robinhood -d robinhood"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: robinhood-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ollama local AI fallback (optional - comment out if not using)
  ollama:
    image: ollama/ollama:latest
    container_name: robinhood-ollama
    restart: unless-stopped
    profiles:
      - ai
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Remove deploy section if you don't have NVIDIA GPU
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./scratch
      dockerfile: Dockerfile.backend
    container_name: robinhood-backend
    restart: unless-stopped
    env_file:
      - ./scratch/.env
    environment:
      # Infrastructure (Docker internal networking)
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-robinhood}:${POSTGRES_PASSWORD:-robinhood}@postgres:5432/${POSTGRES_DB:-robinhood}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      JUDGE0_URL: http://judge0-server:2358
      PISTON_URL: http://piston:2000/api/v2/execute
      SQL_SANDBOX_URL: postgresql://sandbox_reader:sandbox_reader_password@sql-sandbox-postgres:5432/robinhood_sql_sandbox
      SQL_SANDBOX_ADMIN_URL: postgresql://sandbox_user:sandbox_password@sql-sandbox-postgres:5432/robinhood_sql_sandbox
      SQL_SANDBOX_SCHEMA: sandbox_data
      SQL_SANDBOX_READER_ROLE: sandbox_reader
      SQL_SANDBOX_READER_PASSWORD: sandbox_reader_password
      SQL_SANDBOX_ALLOWED_TABLES: departments,employees,products,orders,customers,sales
      CORS_ALLOW_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sql-sandbox-postgres:
        condition: service_healthy
      judge0-server:
        condition: service_started
      piston:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./scratch
      dockerfile: Dockerfile.frontend
    container_name: robinhood-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-robinhood}:${POSTGRES_PASSWORD:-robinhood}@postgres:5432/${POSTGRES_DB:-robinhood}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "5173"

  caddy:
    image: caddy:2.8-alpine
    container_name: robinhood-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  judge0-redis:
    image: redis:7-alpine
    container_name: robinhood-judge0-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "judge0_password"]

  judge0-postgres:
    image: postgres:13
    container_name: robinhood-judge0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data

  judge0-server:
    image: judge0/judge0:1.13.1
    command: ["./scripts/server"]
    container_name: robinhood-judge0-server
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      - REDIS_PASSWORD=judge0_password
      - REDIS_HOST=judge0-redis
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      - POSTGRES_DB=judge0
      - POSTGRES_HOST=judge0-postgres
    depends_on:
      - judge0-postgres
      - judge0-redis
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/box
      - /tmp:/var/local/lib/isolate

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    container_name: robinhood-judge0-worker
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=judge0_password
      - REDIS_HOST=judge0-redis
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      - POSTGRES_DB=judge0
      - POSTGRES_HOST=judge0-postgres
    depends_on:
      - judge0-postgres
      - judge0-redis
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/box
      - /tmp:/var/local/lib/isolate

  sql-sandbox-postgres:
    image: postgres:16
    container_name: robinhood-sql-sandbox
    restart: unless-stopped
    environment:
      POSTGRES_DB: robinhood_sql_sandbox
      POSTGRES_USER: sandbox_user
      POSTGRES_PASSWORD: sandbox_password
    volumes:
      - sql_sandbox_data:/var/lib/postgresql/data
      - ./scratch/server/execution/sql-sandbox-init.sql:/docker-entrypoint-initdb.d/10-sql-sandbox-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox_user -d robinhood_sql_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: robinhood-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston
      - /tmp:/tmp

volumes:
  postgres_data:
  ollama_data:
  judge0_postgres_data:
  sql_sandbox_data:
  isolate_data:
  piston_data:
  caddy_data:
  caddy_config:
